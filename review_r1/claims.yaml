# Registry of every number the R1 response relies on.
#   letter : value as written in REVIEW_R1_PLAN.md / R1_MANUSCRIPT_CHANGES.md
#   file   : result file under results/review_r1/ that must reproduce it
#   status : verified | circular | withdrawn | printed_only   (see common.STATUSES)
# Selectors: JSON -> `path` list; CSV -> `where` (row filter) + `col` or `expr`.
# `op: log10` compares orders of magnitude (tiny p-values); `op: le` is an upper bound.

