[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceti-foraging-reproducibility"
version = "0.1.0"
description = "Reproducible analyses for multiscale sperm-whale foraging"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CETI foraging paper authors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.0,<5",
  "nbclient>=0.9,<1",
  "nbformat>=5.9,<6",
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
dev = [
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
